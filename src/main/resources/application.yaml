spring:
  application:
    name: fx-currency-exchange
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fxcurrency}
    username: ${DB_USER:fx}
    password: ${DB_PASSWORD:fx}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

server:
  port: 8080
  shutdown: graceful

fx:
  provider:
    frankfurter:
      base-url: ${FX_PROVIDER_BASE_URL:https://api.frankfurter.dev/v1}
      connect-timeout: ${FX_PROVIDER_CONNECT_TIMEOUT:2s}
      read-timeout: ${FX_PROVIDER_READ_TIMEOUT:5s}
    circuit-breaker:
      failure-rate-threshold: ${FX_PROVIDER_CB_FAILURE_RATE:50}
      sliding-window-size: ${FX_PROVIDER_CB_WINDOW:10}
      minimum-calls: ${FX_PROVIDER_CB_MIN_CALLS:5}
      wait-in-open-state: ${FX_PROVIDER_CB_WAIT:30s}
      half-open-calls: ${FX_PROVIDER_CB_HALF_OPEN_CALLS:3}
  cache:
    rate-ttl: ${FX_CACHE_RATE_TTL:10m}
  refresh:
    enabled: ${FX_REFRESH_ENABLED:true}
    bases: ${FX_REFRESH_BASES:USD,EUR,BRL}
    cron: "${FX_REFRESH_CRON:0 */5 * * * *}"
    zone: ${FX_REFRESH_ZONE:UTC}
    lock-at-most-for: ${FX_REFRESH_LOCK_AT_MOST_FOR:PT4M}
    lock-at-least-for: ${FX_REFRESH_LOCK_AT_LEAST_FOR:PT30S}