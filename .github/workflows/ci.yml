name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Resumo de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, '
              function pct(covered, missed) { return (covered + missed) > 0 ? 100 * covered / (covered + missed) : 0 }
              NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
              END {
                printf "### Cobertura de testes (JaCoCo)\n\n"
                printf "| Métrica | Cobertura |\n|---|---|\n"
                printf "| Linhas | %.1f%% |\n", pct(lc, lm)
                printf "| Branches | %.1f%% |\n", pct(bc, bm)
              }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Enviar cobertura ao Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  docker:
    name: Imagem Docker e smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fx-currency-exchange:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir a stack completa
        run: docker compose --profile full up -d

      - name: Aguardar a aplicação ficar saudável
        run: |
          for attempt in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Aplicação saudável"
              exit 0
            fi
            sleep 3
          done
          docker compose --profile full logs app
          exit 1

      - name: Verificar documentação OpenAPI e métricas
        run: |
          curl -sf http://localhost:8080/v3/api-docs | grep -q '/api/v1/conversions'
          curl -sf http://localhost:8080/actuator/prometheus | grep -q 'jvm_memory_used_bytes'

      - name: Derrubar a stack
        if: always()
        run: docker compose --profile full down -v