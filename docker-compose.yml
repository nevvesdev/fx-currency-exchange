services:
  postgres:
    image: postgres:17-alpine
    container_name: fx-postgres
    environment:
      POSTGRES_DB: fxcurrency
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: fx
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx -d fxcurrency"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: fx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["full"]
    image: fx-currency-exchange:local
    build:
      context: .
    container_name: fx-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fxcurrency
      DB_USER: fx
      DB_PASSWORD: fx
      REDIS_HOST: redis
    ports:
      - "8080:8080"

volumes:
  pg-data: